# ---------------------------------------------------------------------------
# Media automation stack: Prowlarr -> Sonarr/Radarr -> a download client ->
# Jellyseerr for requests, Bazarr for subs, Jellyfin for playback.
#
# Two selectable download-client architectures, via DOWNLOAD_MODE in .env:
#   seedbox (default): everything downloads on a remote seedbox (qBittorrent +
#     Transmission there), synced back locally via rclone. See README section 9.
#   local: the qbittorrent service below does the actual downloading, no
#     seedbox needed -- gated behind the "local" Compose profile (activated by
#     setting COMPOSE_PROFILES=local in .env; scripts/setup.py does this for
#     you). No VPN by default and no ratio management -- see README's
#     local-mode section.
# DOWNLOAD_MODE only drives scripts/provision.py's API wiring; COMPOSE_PROFILES
# is the separate, Compose-native switch that actually starts/stops the local
# qbittorrent container. Keep them in sync -- provision.py checks this itself.
#
# movies/tv/downloads all live under ONE mounted parent (${MEDIA_ROOT}) rather
# than three separate volumes, on purpose: hardlink imports (copyUsingHardlinks
# in Sonarr/Radarr) can't cross a Docker bind-mount boundary, even when the
# separate mounts point at the same physical drive. Splitting them back into
# separate volumes silently breaks hardlinking again -- Sonarr/Radarr will
# fall back to full copies with no error, doubling disk usage per import. This
# applies to the local qbittorrent service below too, not just seedbox mode.
#
# Layout assumed on host (adjust MEDIA_ROOT/CONFIG_ROOT in .env if not):
#   ${MEDIA_ROOT}/movies
#   ${MEDIA_ROOT}/tv
#   ${MEDIA_ROOT}/downloads
#   ${CONFIG_ROOT}/<service>
# ---------------------------------------------------------------------------

services:

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    ports:
      - "8191:8191"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}:/media
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}:/media
    ports:
      - "7878:7878"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MEDIA_ROOT}:/media
    ports:
      - "6767:6767"
    restart: unless-stopped

  # Local-mode only (see the header note above) -- inert/not started unless
  # COMPOSE_PROFILES includes "local". No VPN by default: this is the
  # zero-cost-of-entry path, not the private/hardened one. See README's
  # local-mode section for the required one-time first-run step (qBittorrent
  # ignores QBT_USER/PASS env vars entirely -- it generates a random temp
  # password on first boot instead). Want a VPN? Layer compose.vpn.yml on top
  # (`docker compose -f compose.yaml -f compose.vpn.yml up -d`) instead of
  # editing this service directly -- it overrides qbittorrent's networking to
  # route through Gluetun and adds the port-forwarding sidecar.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    profiles:
      - local
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${MEDIA_ROOT}:/media
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  # Confirmed software-only transcoding on the native install this replaced
  # (encoding.xml's HardwareAccelerationType was "none") -- no GPU device
  # passthrough needed here. If hardware transcoding is ever turned on later,
  # that needs its own follow-up (GPU passthrough into a Windows container is
  # vendor-specific and not a drop-in addition to this block).
  jellyfin:
    # Pinned to match the native install's exact version (confirmed via
    # /System/Info/Public before migration) -- :latest resolved to a newer minor
    # version whose on-disk DB layout differs (nested data/data/jellyfin.db vs
    # this version's flat data/jellyfin.db), discovered live when the newer image
    # silently initialized a fresh empty database instead of using the migrated
    # one. Bump deliberately later, not implicitly via :latest.
    image: lscr.io/linuxserver/jellyfin:10.11.8
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}:/media
    ports:
      - "8096:8096"
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    init: true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    depends_on:
      - sonarr
      - radarr
    restart: unless-stopped

  # Built from Dockerfile.caddy (not the stock caddy:latest image) to add the
  # Cloudflare DNS module -- needed for the DNS-01 ACME challenge that gets
  # watch.${DOMAIN} a real Let's Encrypt cert without forwarding port 80 from
  # the router (see README section 6 and the Caddyfile's global block).
  # 443 is published alongside 80 for that same public HTTPS route; 80 stays
  # published on the host (LAN hostnames still need it) but is never forwarded
  # at the router, so it's unreachable from the internet either way.
  # caddy_data holds the actual certificates -- without it, every container
  # recreate re-issues from Let's Encrypt and risks the 5-duplicate-certs/week
  # rate limit.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    # Host ports are overridable only for hosts where 80/443 already belong to
    # something else -- a Synology NAS is the real case (DSM's own nginx holds both,
    # see compose.nas.yml). Leave both unset everywhere else.
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN=${DOMAIN}
      - SEEDBOX_HOST=${SEEDBOX_HOST}
      - SEEDBOX_BASIC_AUTH=${SEEDBOX_BASIC_AUTH}
      - ACME_EMAIL=${ACME_EMAIL}
      - CF_API_TOKEN=${CF_API_TOKEN}
      # Where stats.${DOMAIN} proxies to: the host process by default, the
      # `dashboard` container when compose.nas.yml is layered on.
      - DASHBOARD_UPSTREAM=${DASHBOARD_UPSTREAM:-host.docker.internal:8099}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    # Caddy's only remaining use of host.docker.internal is the dashboard's two
    # routes (dashboard/ runs as a host process, not a container). Docker Desktop
    # (Mac/Windows) resolves that hostname automatically; native Linux Docker Engine
    # does not unless told to -- this line is a no-op on Desktop and the actual fix
    # on Linux, the documented cross-platform way to get the same hostname either way.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - jellyseerr
      - jellyfin
    restart: unless-stopped

  # Not part of the request-to-playback pipeline -- a standalone game server
  # added the same way as everything else here, just with a genuinely different
  # exposure story: this is raw UDP/TCP game traffic, not HTTP, so Caddy is
  # irrelevant (this stack's Dockerfile.caddy only builds in the cloudflare-dns
  # and ratelimit plugins, no L4/TCP-proxy module -- see the satisfactory
  # section of README/the self-host-service skill for the direct
  # router-port-forward + grey-cloud-DNS path this needs instead). image is
  # :latest deliberately (unlike jellyfin's pin) -- the community image tracks
  # Satisfactory's own frequent updates and SKIPUPDATE=false already handles
  # in-place game updates on container start, so pinning would just fight that.
  #
  # Profile-gated (add "satisfactory" to COMPOSE_PROFILES, comma-separated alongside
  # "local" if that's on too) so a host that shouldn't run it -- the NAS, which has
  # neither the RAM nor any reason to -- just doesn't start it.
  satisfactory:
    image: wolveix/satisfactory-server:latest
    container_name: satisfactory
    profiles:
      - satisfactory
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - MAXPLAYERS=${SATISFACTORY_MAXPLAYERS:-4}
      - SKIPUPDATE=false
      - STEAMBETA=false
    volumes:
      - ${CONFIG_ROOT}/satisfactory:/config
    ports:
      - "7777:7777/tcp"
      - "7777:7777/udp"
      - "8888:8888/tcp"
    restart: unless-stopped

  # Retro game library (RomM) -- also outside the movie/TV pipeline, but unlike
  # satisfactory it's a plain HTTP web app, so it takes the normal Caddy +
  # Cloudflare route (games.${DOMAIN}, see Caddyfile and README's RomM section).
  # Pinned to the major only: RomM runs its own DB migrations on start, so
  # minor/patch bumps are safe to take implicitly, a major bump should be a
  # deliberate act (softer version of jellyfin's exact pin above). Redis is
  # bundled inside the image -- no separate cache container needed.
  romm:
    image: rommapp/romm:5
    container_name: romm
    environment:
      - TZ=${TZ:-UTC}
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm
      - DB_PASSWD=${ROMM_DB_PASSWORD}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
      # The public URL, used for invite links and QR codes; the plain-http LAN
      # hostname keeps working regardless (ROMM_SESSION_SECURE_COOKIE is left at
      # its default of off for exactly that reason -- turning it on would break
      # LAN login).
      - ROMM_BASE_URL=https://games.${DOMAIN}
      # Hash-based matching, no account needed. Everything else is an optional
      # key in .env; blank = that provider is simply off.
      - HASHEOUS_API_ENABLED=true
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY}
      - RETROACHIEVEMENTS_API_KEY=${RETROACHIEVEMENTS_API_KEY}
      - SCREENSCRAPER_USER=${SCREENSCRAPER_USER}
      - SCREENSCRAPER_PASSWORD=${SCREENSCRAPER_PASSWORD}
      # Nightly rescan instead of RomM's filesystem watcher: inotify events
      # don't reliably cross the Windows-NTFS-into-Linux bind-mount boundary
      # (the same reason Jellyfin's realtime monitor is only a backup here, see
      # CLAUDE.md). Drop files in, hit Scan in the UI, or wait for 4am.
      - ENABLE_SCHEDULED_RESCAN=true
      - SCHEDULED_RESCAN_CRON=0 4 * * *
      - SCAN_WORKERS=4
      - WEB_SERVER_CONCURRENCY=2
    volumes:
      # roms/<platform>/ and bios/<platform>/ live under this one root -- see
      # .env.example's ROMS_ROOT comment for the layout RomM expects.
      - ${ROMS_ROOT}:/romm/library
      - ${CONFIG_ROOT}/romm/config:/romm/config
      - ${CONFIG_ROOT}/romm/assets:/romm/assets
      - ${CONFIG_ROOT}/romm/resources:/romm/resources
      - romm_redis:/redis-data
    ports:
      # 8080 on the host belongs to local-mode qbittorrent (profile-gated but
      # would collide the moment that profile is on), hence 8085.
      - "8085:8080"
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  # Named volume rather than a ${CONFIG_ROOT} bind mount, on purpose: InnoDB on a
  # Windows bind mount (9p/virtiofs through Docker Desktop) is a known
  # corruption/perf trap and RomM's own docs say to use a volume for the DB.
  # Backup is therefore `docker exec romm-db mariadb-dump ...` (README), not a
  # folder copy. Never published to the host -- romm reaches it container-to-
  # container only.
  romm-db:
    image: mariadb:11
    container_name: romm-db
    environment:
      - TZ=${TZ:-UTC}
      - MARIADB_ROOT_PASSWORD=${ROMM_DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm
      - MARIADB_PASSWORD=${ROMM_DB_PASSWORD}
    volumes:
      - romm_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  romm_db:
  romm_redis:
